name: Feature request
description: Propose a feature or improve an existing workflow.
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: Explain what you are trying to accomplish and the current limitation.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe how clai should behave, with an example when useful.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any existing workarounds or other approaches considered.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI or terminal interface
        - Session persistence or shared attachments
        - Providers or authentication
        - Tools, MCP, or skills
        - Planning or subagents
        - Security testing or permissions
        - Configuration or privacy
        - Installation or distribution
        - Documentation
        - Performance
        - Other

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include examples or relevant details without credentials or private data.

  - type: checkboxes
    id: checklist
    attributes:
      label: Existing requests
      options:
        - label: I searched existing issues and feature requests for this idea.
          required: true
