name: Bug report
description: Report reproducible incorrect behavior in clai.
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Include the smallest reproduction you can provide. Remove credentials and private data from logs, screenshots, and configuration. Follow SECURITY.md for vulnerability reports.

  - type: input
    id: version
    attributes:
      label: clai version
      description: Output of `clai --version`.
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system and architecture
      description: Include the OS version, x64 or ARM64, and WSL or container details if relevant.
      placeholder: Ubuntu 24.04, ARM64
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Native installer or release binary
        - npm
        - Homebrew
        - Source checkout
        - Other
    validations:
      required: true

  - type: input
    id: runtime
    attributes:
      label: Node.js or Bun version
      description: Include `node --version` or `bun --version` when using npm or a source checkout. Native releases include their runtime.

  - type: dropdown
    id: ui
    attributes:
      label: Interface
      options:
        - OpenTUI
        - Classic
        - One-shot command or piped input
        - Startup or configuration command
        - Unsure
    validations:
      required: true

  - type: input
    id: provider-model
    attributes:
      label: Provider and model
      description: Include the provider and model, if relevant. Do not include API keys or account tokens.
      placeholder: qoder / auto

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the incorrect behavior and its effect on your workflow.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include commands, permission mode, and any session switching or attachment steps.
      placeholder: |
        1. Start clai with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message or observed result.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste redacted output. Do not attach complete history or credential files.
      render: text

  - type: textarea
    id: terminal-setup
    attributes:
      label: Terminal and session setup
      description: For UI or persistence issues, include the terminal application, SSH setup, attached windows, and whether history or private mode was enabled.

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Include relevant configuration, a source commit if applicable, or a minimal example.

  - type: checkboxes
    id: checklist
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues for this problem.
          required: true
