name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "ui/**"

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }} semantic suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # `runner` context isn't available in job-level `env:` (GitHub Actions
      # only resolves it inside steps), so derive these from $RUNNER_TEMP here.
      - name: Set CI directories
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - name: Install ripgrep (shell search tests)
        run: |
          sudo apt-get update -o Acquire::Retries=3 || echo "::warning::apt-get update hit a mirror mismatch; continuing with cached indexes"
          sudo apt-get install -y ripgrep
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install isolated updater fixture managers
        run: |
          npm install --prefix "${RUNNER_TEMP}/clai-updater-managers" pnpm@11.22.0 yarn@1.22.22 --no-audit --no-fund
          echo "${RUNNER_TEMP}/clai-updater-managers/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run embed-prompts:check
      - run: npm run typecheck
      # Canonical locale/timezone are applied before Node starts by
      # scripts/run-tests.mjs.
      - run: npm run test:deterministic -- --reporter=dot
        env:
          CLAI_TEST_REQUIRE_MANAGERS: "1"
      # Guard against accidental locale/timezone coupling: the environment
      # characterization suite must also pass on the raw host env.
      - run: npm run test:host -- test/environment --reporter=dot
      - run: npm run build
      - name: Smoke-test the built entrypoint
        run: |
          node dist/index.js --version
          node dist/index.js --help > /dev/null
      # Classic pty smoke runs here (node 22 leg only) so ubuntu coverage needs
      # no dedicated job; classic-posix below provides the macOS leg.
      - name: Classic pty smoke
        if: matrix.node == 22
        run: npm run test:classic:pty -- --timeout 20
      - run: npm run release:verify
      - name: Upload redacted local diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: node-failure-artifacts-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/clai/logs
            ${{ runner.temp }}/clai/artifacts
          if-no-files-found: ignore
          retention-days: 7

  bun-opentui:
    name: Bun 1.3.14 OpenTUI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set CI directories
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bun --version
      - run: bun run test:bun
      - name: Full transcript and private credential UI contracts
        run: |
          bun run test/tui-v2/long-session.native.ts 1000
          bun run test/tui-v2/credentials.native.ts
      - name: Upload redacted local diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bun-opentui-failure-artifacts
          path: |
            ${{ runner.temp }}/clai/logs
            ${{ runner.temp }}/clai/artifacts
          if-no-files-found: ignore
          retention-days: 7

  process-platforms:
    # ubuntu is intentionally omitted: the `node` job already runs the full
    # suite (incl. privilege-boundary + jobs-durable) on ubuntu. This matrix
    # exists only for cross-OS coverage that ubuntu cannot provide.
    name: Process and privilege (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set CI directories
        shell: bash
        run: |
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/privilege-boundary.test.ts --reporter=dot
      - name: Process-tree termination contract
        run: npx vitest run test/process-tree.test.ts --reporter=dot
      - name: Session scratch retention and storage failure contracts
        run: npx vitest run test/session-workspace-cleanup.test.ts test/os/runtime-error.test.ts test/dev-launcher-failure.test.ts --reporter=dot
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Updater provenance, execution and native PowerShell contracts
        run: npx vitest run test/update-install.test.ts test/update-detection-regressions.test.ts test/update-provenance.test.ts test/update-execution.test.ts test/update-metadata.test.ts test/update-permissions.test.ts test/update-windows-stage.test.ts test/update-windows-worker.test.ts --reporter=dot
      - name: Prompt history and Classic terminal colors
        run: npx vitest run test/store/session-prompts.test.ts test/app/session-prompts.test.ts test/classic/app/prompts.test.ts test/ui-core/composer/saved-prompt-history.test.ts test/session-runtime/terminal-options.test.ts test/session-runtime/view-manager.test.ts test/ui-core/capabilities.test.ts --reporter=dot
      - name: Minimise and Windows console fallback
        run: npx vitest run test/ui-core/minimise-command.test.ts test/os/windows-console.test.ts --reporter=dot
      - name: Detached runtime startup, reattachment and process identity
        run: npx vitest run test/session-runtime/startup.test.ts test/session-runtime/startup-identity.test.ts test/session-runtime/startup.integration.test.ts test/session-runtime/metadata-write.test.ts test/session-runtime/store.test.ts test/session-runtime/cli-pipe.integration.test.ts test/session-runtime/launch.test.ts test/os/process-identity.test.ts test/interactive-session/pipe-process.test.ts --reporter=dot
      - name: RTK portable installation, updates and archive integrity
        run: npx vitest run test/rtk-install.test.ts test/rtk-maintenance-windows.test.ts test/rtk-windows-binary-fallback.test.ts test/rtk-windows-portable.test.ts test/rtk-archive.test.ts test/rtk-binary-selection.test.ts test/rtk-command.test.ts --reporter=dot
      - name: REA installation, lifecycle, composer and cache contracts
        run: node scripts/run-tests.mjs test/rea test/agent/stable-catalog-cache-continuity.test.ts --reporter=dot
      - name: MCP transports, authentication, and storage
        run: npx vitest run test/mcp --reporter=dot
      - if: runner.os != 'Windows'
        run: npx vitest run test/jobs-durable.test.ts test/jobs-resource-hygiene.test.ts --reporter=dot
      - name: Built entrypoint smoke
        run: |
          npm run build
          node dist/index.js --version


  classic-posix:
    # ubuntu is intentionally omitted: the `node` job already runs the full
    # suite (test/classic, test/ui-core and test/noninteractive included) and
    # the classic pty smoke on ubuntu. This job exists only for macOS POSIX
    # coverage that ubuntu cannot provide.
    name: Classic POSIX (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Set CI directories
        shell: bash
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/classic test/ui-core test/noninteractive --reporter=dot
      - run: npm run test:classic:pty -- --timeout 20
