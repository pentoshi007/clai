name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "ui/**"

permissions:
  contents: read

jobs:
  node:
    name: Node ${{ matrix.node }} semantic suite
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      # `runner` context isn't available in job-level `env:` (GitHub Actions
      # only resolves it inside steps), so derive these from $RUNNER_TEMP here.
      - name: Set CI directories
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run embed-prompts:check
      - run: npm run typecheck
      - run: npm test -- --reporter=dot
      - run: npm run build
      - name: Smoke-test the built entrypoint
        run: |
          node dist/index.js --version
          node dist/index.js --help > /dev/null
      - run: npm run release:verify
      - name: Upload redacted local diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: node-failure-artifacts-${{ matrix.node }}
          path: |
            ${{ runner.temp }}/clai/logs
            ${{ runner.temp }}/clai/artifacts
          if-no-files-found: ignore
          retention-days: 7

  bun-opentui:
    name: Bun 1.3.14 OpenTUI conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set CI directories
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bun --version
      - run: bun run test:bun
      - name: Upload redacted local diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: bun-opentui-failure-artifacts
          path: |
            ${{ runner.temp }}/clai/logs
            ${{ runner.temp }}/clai/artifacts
          if-no-files-found: ignore
          retention-days: 7

  process-platforms:
    # ubuntu is intentionally omitted: the `node` job already runs the full
    # suite (incl. privilege-boundary + jobs-durable) on ubuntu. This matrix
    # exists only for cross-OS coverage that ubuntu cannot provide.
    name: Process and privilege (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set CI directories
        shell: bash
        run: |
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/privilege-boundary.test.ts --reporter=dot
      - name: Process-tree termination contract
        run: npx vitest run test/process-tree.test.ts --reporter=dot
      - if: runner.os != 'Windows'
        run: npx vitest run test/jobs-durable.test.ts test/jobs-resource-hygiene.test.ts --reporter=dot
      - name: Built entrypoint smoke
        run: |
          npm run build
          node dist/index.js --version


  classic-posix:
    name: Classic POSIX (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Set CI directories
        shell: bash
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/classic test/ui-core test/noninteractive --reporter=dot
      - run: npm run test:classic:pty -- --timeout 20
