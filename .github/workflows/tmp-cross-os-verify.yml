name: Temporary cross-OS verification

on:
  push:
    branches:
      - perf/scroll-and-session-storage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-full:
    name: Linux full suite (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - name: Set CI directories
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - run: |
          sudo apt-get update -o Acquire::Retries=3 || true
          sudo apt-get install -y ripgrep
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: |
          npm install --prefix "${RUNNER_TEMP}/clai-updater-managers" pnpm@11.22.0 yarn@1.22.22 --no-audit --no-fund
          echo "${RUNNER_TEMP}/clai-updater-managers/node_modules/.bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run embed-prompts:check
      - run: npm run typecheck
      - run: npm run test:deterministic -- --reporter=dot
        env:
          CLAI_TEST_REQUIRE_MANAGERS: "1"
      - run: npm run build
      - run: node dist/index.js --version
      - run: npm run test:classic:pty -- --timeout 20
      - run: npm run release:verify

  linux-root:
    name: Linux storage under sudo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: sudo -E env "PATH=$PATH" npx vitest run test/store/session-migration.test.ts test/session-runtime/sudo-ownership.test.ts test/os/ownership-repair.test.ts --reporter=verbose

  bun-opentui:
    name: OpenTUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Set CI directories
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bun run test:bun
      - run: npx vitest run test/tui-v2 --reporter=dot

  cross-os:
    name: ${{ matrix.os }} full suite (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        label: [branch, base]
        include:
          - label: branch
            ref: ${{ github.sha }}
          - label: base
            ref: 655dca0d0295e1562bd67ca83db1113293ddbd0c
          - os: windows-latest
            label: first-ci-commit
            ref: 556a4d15a03c61323581e1eb17c076e16f0fa2a8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ matrix.ref }}
      - name: Set CI directories
        shell: bash
        run: |
          echo "CLAI_CONFIG_DIR=${RUNNER_TEMP}/clai/config" >> "$GITHUB_ENV"
          echo "CLAI_DATA_DIR=${RUNNER_TEMP}/clai/data" >> "$GITHUB_ENV"
          echo "CLAI_ARTIFACT_DIR=${RUNNER_TEMP}/clai/artifacts" >> "$GITHUB_ENV"
          echo "CLAI_LOG_DIR=${RUNNER_TEMP}/clai/logs" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run typecheck
      - name: Full deterministic suite
        shell: bash
        run: npm run test:deterministic -- --reporter=dot --reporter=junit --outputFile.junit="${RUNNER_TEMP}/junit.xml"
      - name: Failed test names
        if: always()
        shell: bash
        run: |
          python3 - "${RUNNER_TEMP}/junit.xml" <<'PY' | tee "${RUNNER_TEMP}/failed.txt"
          import sys, xml.etree.ElementTree as ET
          try:
              root = ET.parse(sys.argv[1]).getroot()
          except Exception as error:
              print(f"no junit report: {error}")
              raise SystemExit
          for case in root.iter("testcase"):
              problem = case.find("failure")
              if problem is None:
                  problem = case.find("error")
              if problem is not None:
                  print(f"FAILED {case.get('classname')} :: {case.get('name')}")
                  detail = (problem.get("message") or "") + "\n" + (problem.text or "")
                  for line in [line for line in detail.splitlines() if line.strip()][:8]:
                      print(f"    {line[:300]}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failed-${{ matrix.os }}-${{ matrix.label }}
          path: ${{ runner.temp }}/failed.txt
          if-no-files-found: ignore

  native-binary:
    name: Native binary migration smoke (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: release/clai-bun-linux-x64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: release/clai-bun-darwin-arm64
          - os: windows-latest
            target: bun-windows-x64
            binary: release/clai-bun-windows-x64.exe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - run: npm run compile -- --target ${{ matrix.target }}
      - shell: bash
        run: ./${{ matrix.binary }} --version
      - shell: bash
        run: node scripts/ci-tmp/migration-smoke.mjs "$PWD/${{ matrix.binary }}"
