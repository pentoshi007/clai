name: tmp-rea-engines-live

on:
  push:
    branches:
      - feat/rea-engines-cross-os

permissions:
  contents: read

jobs:
  live:
    name: live ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: windows-x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install engines and analyze a real binary
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TMP_LABEL: ${{ matrix.label }}
        run: node --import tsx scripts/tmp-engines-smoke.ts

  base-project-root:
    name: project-root test at the base commit on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: 1945c4d17b235d110120cccf241c886f28e9d9b6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The same file before any of this branch's changes
        run: node scripts/run-tests.mjs test/project-root.test.ts --reporter=default
